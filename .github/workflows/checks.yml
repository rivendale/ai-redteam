# Offline checks on every pull request and every push to main. No model is called and no secret is used.
# What runs: the scorer's self-check, the findings validator's self-check, every eval case's ground-truth
# proof, a byte-compile of every Python file, and a parse of every JSON file. Three Python versions,
# because a check that passes on one version is evidence about that version only.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request replaces its running checks. Pushes to main are never cancelled, so two quick
# merges each keep their own result.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The required status checks to set in branch protection are named after the job and the matrix value:
# "offline (3.12)", "offline (3.13)" and "offline (3.14)", not "checks". A pull request that edits this file runs its own edited
# copy, so a change here needs a human read.
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Scorer self-check
        run: python3 evals/score.py --self-check
      - name: Published variance regression (offline only)
        run: |
          python3 tests/test_variance.py
          python3 tests/test_variance_published.py --source .
      - name: Findings validator self-check
        run: python3 tools/validate_findings.py --self-check
      - name: Assess validator self-check
        run: python3 tools/validate_assess.py --self-check
      - name: Assess scorer self-check
        run: python3 evals/score_assess.py --self-check
      - name: Assess case proofs
        run: python3 evals/tools/verify_cases.py --cases evals/assess/cases
      - name: Assess hold-out case proofs
        run: python3 evals/tools/verify_cases.py --cases evals/assess/holdout/cases
      - name: Assess second hold-out case proofs
        run: python3 evals/tools/verify_cases.py --cases evals/assess/holdout2/cases
      - name: Assess third hold-out case proofs
        run: python3 evals/tools/verify_cases.py --cases evals/assess/holdout3/cases
      - name: Eval case proofs (every planted defect demonstrated, every control's tests pass)
        run: python3 evals/tools/verify_cases.py
      - name: Redteam hold-out case proofs
        run: python3 evals/tools/verify_cases.py --cases evals/holdout/cases
      - name: Evidence development case proofs
        run: python3 evals/tools/verify_cases.py --cases evals/evidence/cases
      - name: Supply-chain development case proofs
        run: python3 evals/tools/verify_cases.py --cases evals/supplychain/cases
      - name: Scanner key-shape patterns
        run: python3 tests/test_scan_secrets_keys.py
      - name: Byte-compile every Python file
        run: python3 -m compileall -q -x '/evals/cases/' .
      - name: Parse every JSON file
        run: |
          git ls-files -z '*.json' | xargs -0 -n1 python3 -m json.tool --no-ensure-ascii > /dev/null
      - name: PR review Action security boundary tests
        run: |
          python3 tests/test_pr_review_action.py
          python3 tests/test_pr_review_errors.py
          python3 tests/test_run_reviews_fallback.py
          python3 tests/test_osv.py
          python3 tests/test_osv_integration.py
          python3 tests/test_pr_review_room.py
      - name: Portable multi-host installation tests
        run: python3 tests/test_portable_install.py --source .
